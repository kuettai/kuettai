<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="KuetTai: Solutions Architect and meeple wrangler">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D2C1E"/>
      <stop offset="1" stop-color="#2B1D14"/>
    </linearGradient>
    <path id="meeple" d="M50 5 C60 5 66 12 66 22 C66 28 63 32 60 35 L88 44 C96 47 97 58 88 60 L70 62 L82 92 C84 97 80 100 75 100 L58 100 L50 84 L42 100 L25 100 C20 100 16 97 18 92 L30 62 L12 60 C3 58 4 47 12 44 L40 35 C37 32 34 28 34 22 C34 12 40 5 50 5 Z"/>
  </defs>

  <!-- table -->
  <rect width="1000" height="260" rx="22" fill="url(#wood)"/>
  <g stroke="#F1E3C8" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="52" x2="1000" y2="48"/>
    <line x1="0" y1="104" x2="1000" y2="110"/>
    <line x1="0" y1="158" x2="1000" y2="154"/>
  </g>

  <!-- board track -->
  <g opacity="0.55">
    <rect x="40"  y="222" width="36" height="20" rx="4" fill="#E63946"/>
    <rect x="84"  y="222" width="36" height="20" rx="4" fill="#F4A261"/>
    <rect x="128" y="222" width="36" height="20" rx="4" fill="#2A9D8F"/>
    <rect x="172" y="222" width="36" height="20" rx="4" fill="#457B9D"/>
    <rect x="216" y="222" width="36" height="20" rx="4" fill="#8E7DBE"/>
    <rect x="260" y="222" width="36" height="20" rx="4" fill="#E63946"/>
    <rect x="304" y="222" width="36" height="20" rx="4" fill="#F4A261"/>
    <rect x="348" y="222" width="36" height="20" rx="4" fill="#2A9D8F"/>
    <rect x="392" y="222" width="36" height="20" rx="4" fill="#457B9D"/>
    <rect x="436" y="222" width="36" height="20" rx="4" fill="#8E7DBE"/>
  </g>

  <!-- title -->
  <text x="40" y="112" font-family="Trebuchet MS, Verdana, sans-serif" font-size="68" font-weight="bold" fill="#F4A261">KuetTai</text>
  <text x="42" y="154" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" fill="#F1E3C8">Solutions Architect · Meeple Wrangler · Malaysia</text>
  <text x="42" y="188" font-family="Trebuchet MS, Verdana, sans-serif" font-size="16" fill="#F1E3C8" fill-opacity="0.65">Roll for initiative. Let's build something fun.</text>

  <!-- die -->
  <g transform="translate(905 58)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;12;-12;0" dur="4s" repeatCount="indefinite"/>
      <rect x="-28" y="-28" width="56" height="56" rx="10" fill="#F1E3C8"/>
      <circle cx="-14" cy="-14" r="5" fill="#2B1D14"/>
      <circle cx="14" cy="-14" r="5" fill="#2B1D14"/>
      <circle cx="0" cy="0" r="5" fill="#2B1D14"/>
      <circle cx="-14" cy="14" r="5" fill="#2B1D14"/>
      <circle cx="14" cy="14" r="5" fill="#2B1D14"/>
    </g>
  </g>

  <!-- meeples -->
  <g fill="#000" fill-opacity="0.35">
    <ellipse cx="595" cy="232" rx="28" ry="6"/>
    <ellipse cx="675" cy="232" rx="28" ry="6"/>
    <ellipse cx="755" cy="232" rx="28" ry="6"/>
    <ellipse cx="835" cy="232" rx="28" ry="6"/>
    <ellipse cx="915" cy="232" rx="28" ry="6"/>
  </g>
  <g transform="translate(560 158) scale(0.7)">
