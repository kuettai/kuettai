  </g>
  <g transform="translate(640 158) scale(0.7)">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -26;0 0;0 0" keyTimes="0;0.2;0.4;1" dur="2.5s" begin="0.25s" repeatCount="indefinite"/>
      <use xlink:href="#meeple" href="#meeple" fill="#F4A261"/></g>
  </g>
  <g transform="translate(720 158) scale(0.7)">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -26;0 0;0 0" keyTimes="0;0.2;0.4;1" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
      <use xlink:href="#meeple" href="#meeple" fill="#2A9D8F"/></g>
  </g>
  <g transform="translate(800 158) scale(0.7)">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -26;0 0;0 0" keyTimes="0;0.2;0.4;1" dur="2.5s" begin="0.75s" repeatCount="indefinite"/>
      <use xlink:href="#meeple" href="#meeple" fill="#457B9D"/></g>
  </g>
  <g transform="translate(880 158) scale(0.7)">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -26;0 0;0 0" keyTimes="0;0.2;0.4;1" dur="2.5s" begin="1s" repeatCount="indefinite"/>
      <use xlink:href="#meeple" href="#meeple" fill="#8E7DBE"/></g>
