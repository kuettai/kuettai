name: Meeple march (contribution snake)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E63946&color_dots=#F1E3C8,#F4A261,#2A9D8F,#457B9D,#8E7DBE
            dist/snake-dark.svg?palette=github-dark&color_snake=#F4A261&color_dots=#2B1D14,#F4A261,#2A9D8F,#457B9D,#8E7DBE

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
